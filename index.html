<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="./css/style.css">
    <script src="./js/script.js" defer></script>

    <title>Document</title>
</head>

<body>

    <div class="game-board">

        <!-- TELA DE INÍCIO -->
        <div id="start-screen">
            <h1>Meu Jogo</h1>
            <button id="start-btn">Iniciar</button>
        </div>

        <div id="player"></div>

        <!-- TELA DE GAME OVER -->
        <div id="game-over">
            <h1>Game Over</h1>
            <input id="player-name" placeholder="Seu nome" />
            <button id="save-score">Salvar</button>

            <div id="ranking"></div>
            <button id="restart-btn">Reiniciar</button>
        </div>

    </div>

</body>

</html>
