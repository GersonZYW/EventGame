<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="./css/style.css">
    <script src="./js/script.js" defer></script>

    <title>Document</title>
</head>

<body>
    <h1 class="text-board">Bem-vindo</h1>
    <div class="game-board">

        <!-- TELA DE INÍCIO -->
        <div id="start-screen">
            <h1 class="game-title">Samurai Running</h1>
            <button id="start-btn" class="btn-pixel">START</button>
        </div>

        <div id="player"></div>

        <!-- TELA DE GAME OVER -->
        <div id="game-over">
            <h1>Game Over</h1>
            <div class="form-group">
                <input id="player-name" placeholder="Seu nome" maxlength="8" />
                <button id="save-score" class="btn-pixel btn-green">Salvar</button>
            </div>
            <div id="ranking"></div>
            <button id="restart-btn" class="btn-pixel btn-red">Reiniciar</button>
        </div>

    </div>

</body>

</html>
